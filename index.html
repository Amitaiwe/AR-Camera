<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>AR מצלמה ✨</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@400;700;900&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#000;font-family:'Rubik',sans-serif;overflow:hidden;height:100dvh;}
  #app{position:relative;width:100vw;height:100dvh;}
  #video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);}
  #overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
  #topbar{position:absolute;top:0;left:0;right:0;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(to bottom,rgba(0,0,0,0.6),transparent);z-index:10;}
  #app-title{font-size:21px;font-weight:900;color:#fff;letter-spacing:-0.5px;}
  #face-status{font-size:12px;color:rgba(255,255,255,.85);background:rgba(255,255,255,.13);padding:5px 13px;border-radius:20px;backdrop-filter:blur(8px);}
  #filters-bar{position:absolute;bottom:112px;left:0;right:0;display:flex;gap:10px;padding:6px 14px;overflow-x:auto;scrollbar-width:none;z-index:10;}
  #filters-bar::-webkit-scrollbar{display:none;}
  .filter-btn{flex-shrink:0;width:66px;height:66px;border-radius:18px;border:2.5px solid rgba(255,255,255,.18);background:rgba(10,10,20,.75);backdrop-filter:blur(10px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;transition:all .18s;font-size:26px;-webkit-tap-highlight-color:transparent;}
  .filter-btn span.label{font-size:9px;font-weight:700;color:rgba(255,255,255,.8);}
  .filter-btn.active{border-color:#ff3cac;background:rgba(255,60,172,.22);box-shadow:0 0 16px rgba(255,60,172,.5);transform:scale(1.1);}
  #bottom-controls{position:absolute;bottom:0;left:0;right:0;height:104px;display:flex;align-items:center;justify-content:center;gap:28px;background:linear-gradient(to top,rgba(0,0,0,.72),transparent);z-index:10;padding-bottom:10px;}
  #capture-btn{width:72px;height:72px;border-radius:50%;border:4px solid #fff;background:rgba(255,255,255,.15);cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;}
  #capture-btn::after{content:'';width:54px;height:54px;border-radius:50%;background:#fff;transition:all .12s;}
  #capture-btn:active::after{width:44px;height:44px;}
  #flip-btn,#save-btn{width:48px;height:48px;border-radius:50%;border:none;background:rgba(255,255,255,.15);backdrop-filter:blur(8px);color:#fff;font-size:21px;cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;}
  #loading{position:absolute;inset:0;background:linear-gradient(135deg,#080818,#140028);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:100;}
  #loading.hidden{display:none;}
  #loading-emoji{font-size:68px;animation:bob 1s infinite alternate;}
  @keyframes bob{from{transform:translateY(0) scale(1)}to{transform:translateY(-8px) scale(1.1)}}
  #loading-text{font-size:19px;font-weight:700;color:#fff;}
  #loading-sub{font-size:13px;color:rgba(255,255,255,.45);}
  .bar-wrap{width:200px;height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden;}
  #progress-bar{height:100%;width:0%;border-radius:3px;background:linear-gradient(90deg,#ff3cac,#784ba0,#2b86c5);transition:width .3s;}
  #flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:50;transition:opacity .08s;}
  #flash.on{opacity:.85;}
  #no-face{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:rgba(255,255,255,.6);font-size:13px;font-weight:700;background:rgba(0,0,0,.45);padding:9px 18px;border-radius:18px;backdrop-filter:blur(8px);opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;}
  #no-face.show{opacity:1;}
  #permission-screen{position:absolute;inset:0;background:linear-gradient(135deg,#080818 0%,#140028 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:200;padding:40px;text-align:center;}
  #permission-screen.hidden{display:none;}
  .perm-icon{font-size:72px;}
  .perm-title{font-size:26px;font-weight:900;color:#fff;}
  .perm-desc{font-size:14px;color:rgba(255,255,255,.55);line-height:1.6;max-width:270px;}
  #start-btn{margin-top:8px;padding:15px 38px;border-radius:28px;border:none;background:linear-gradient(135deg,#ff3cac,#784ba0,#2b86c5);color:#fff;font-family:'Rubik',sans-serif;font-size:17px;font-weight:700;cursor:pointer;box-shadow:0 8px 28px rgba(255,60,172,.4);transition:all .2s;}
  #start-btn:active{transform:scale(.96);}
</style>
</head>
<body>
<div id="app">
  <div id="permission-screen">
    <div class="perm-icon">📸</div>
    <div class="perm-title">AR מצלמה ✨</div>
    <div class="perm-desc">פתח פה, עצום עיניים, הרם גבות — כל דבר מפעיל אפקט אחר! 🤩</div>
    <button id="start-btn" onclick="init()">פתח מצלמה 🎉</button>
  </div>
  <div id="loading">
    <div id="loading-emoji">🤳</div>
    <div id="loading-text">טוען...</div>
    <div id="loading-sub">רק רגע אחד</div>
    <div class="bar-wrap"><div id="progress-bar"></div></div>
  </div>
  <video id="video" autoplay muted playsinline></video>
  <canvas id="overlay"></canvas>
  <div id="flash"></div>
  <div id="no-face">📷 הצב את הפנים במסגרת</div>
  <div id="topbar">
    <div id="app-title">✨ AR מצלמה</div>
    <div id="face-status">ממתין...</div>
  </div>
  <div id="filters-bar">
    <div class="filter-btn active" onclick="setFilter('none')"      data-filter="none">      <span>🚫</span><span class="label">ללא</span></div>
    <div class="filter-btn"        onclick="setFilter('unicorn')"   data-filter="unicorn">   <span>🦄</span><span class="label">חד קרן</span></div>
    <div class="filter-btn"        onclick="setFilter('kawaii')"    data-filter="kawaii">    <span>🥺</span><span class="label">קוואי</span></div>
    <div class="filter-btn"        onclick="setFilter('catgirl')"   data-filter="catgirl">   <span>🐱</span><span class="label">חתולה</span></div>
    <div class="filter-btn"        onclick="setFilter('bunny')"     data-filter="bunny">     <span>🐰</span><span class="label">ארנב</span></div>
    <div class="filter-btn"        onclick="setFilter('butterfly')" data-filter="butterfly"> <span>🦋</span><span class="label">פרפר</span></div>
    <div class="filter-btn"        onclick="setFilter('mermaid')"   data-filter="mermaid">   <span>🧜</span><span class="label">בת ים</span></div>
    <div class="filter-btn"        onclick="setFilter('fairy')"     data-filter="fairy">     <span>🧚</span><span class="label">פיה</span></div>
    <div class="filter-btn"        onclick="setFilter('tiara')"     data-filter="tiara">     <span>👸</span><span class="label">נסיכה</span></div>
    <div class="filter-btn"        onclick="setFilter('flowers')"   data-filter="flowers">   <span>🌸</span><span class="label">פרחים</span></div>
    <div class="filter-btn"        onclick="setFilter('hearts')"    data-filter="hearts">    <span>💖</span><span class="label">לבבות</span></div>
    <div class="filter-btn"        onclick="setFilter('rainbow')"   data-filter="rainbow">   <span>🌈</span><span class="label">קשת</span></div>
    <div class="filter-btn"        onclick="setFilter('stars')"     data-filter="stars">     <span>⭐</span><span class="label">כוכבים</span></div>
    <div class="filter-btn"        onclick="setFilter('glitter')"   data-filter="glitter">   <span>✨</span><span class="label">גליטר</span></div>
    <div class="filter-btn"        onclick="setFilter('bear')"      data-filter="bear">      <span>🐻</span><span class="label">דובי</span></div>
    <div class="filter-btn"        onclick="setFilter('disco')"     data-filter="disco">     <span>🪩</span><span class="label">דיסקו</span></div>
    <div class="filter-btn"        onclick="setFilter('fire')"      data-filter="fire">      <span>🔥</span><span class="label">אש</span></div>
    <div class="filter-btn"        onclick="setFilter('devil')"     data-filter="devil">     <span>😈</span><span class="label">שד</span></div>
    <div class="filter-btn"        onclick="setFilter('alien')"     data-filter="alien">     <span>👽</span><span class="label">חייזר</span></div>
    <div class="filter-btn"        onclick="setFilter('clown')"     data-filter="clown">     <span>🤡</span><span class="label">ליצן</span></div>
    <div class="filter-btn"        onclick="setFilter('nerd')"      data-filter="nerd">      <span>🤓</span><span class="label">נרד</span></div>
    <div class="filter-btn"        onclick="setFilter('crown')"     data-filter="crown">     <span>👑</span><span class="label">כתר</span></div>
    <div class="filter-btn"        onclick="setFilter('glasses')"   data-filter="glasses">   <span>🕶️</span><span class="label">משקפיים</span></div>
    <div class="filter-btn"        onclick="setFilter('mustache')"  data-filter="mustache">  <span>👨</span><span class="label">שפם</span></div>
    <div class="filter-btn"        onclick="setFilter('dog')"       data-filter="dog">       <span>🐶</span><span class="label">כלב</span></div>
  </div>
  <div id="bottom-controls">
    <button id="flip-btn" onclick="flipCamera()">🔄</button>
    <button id="capture-btn" onclick="capturePhoto()"></button>
    <button id="save-btn"    onclick="savePhoto()">💾</button>
  </div>
</div>
<script type="module">
import vision from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/+esm';
const { FaceLandmarker, FilesetResolver } = vision;

let video,canvas,ctx,landmarker=null,currentFilter='none',facingMode='user',stream=null,lastCaptured=null,lastResults=null,running=false,lastVideoTime=-1;

async function init(){
  document.getElementById('permission-screen').classList.add('hidden');
  video=document.getElementById('video');canvas=document.getElementById('overlay');ctx=canvas.getContext('2d');
  window.addEventListener('resize',resizeCanvas);
  setP(10,'📷 פותח מצלמה...');await openCamera();
  setP(40,'🧠 טוען זיהוי פנים...');await loadLM();
  setP(100,'✅ מוכן!');
  setTimeout(()=>{document.getElementById('loading').classList.add('hidden');running=true;requestAnimationFrame(loop);},350);
}
window.init=init;
function setP(p,t){document.getElementById('progress-bar').style.width=p+'%';document.getElementById('loading-text').textContent=t;}

async function openCamera(){
  if(stream)stream.getTracks().forEach(t=>t.stop());
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode,width:{ideal:1280},height:{ideal:720}},audio:false});
  video.srcObject=stream;await new Promise(r=>{video.onloadedmetadata=r;});resizeCanvas();
}
function resizeCanvas(){canvas.width=video.clientWidth||window.innerWidth;canvas.height=video.clientHeight||window.innerHeight;}

async function loadLM(){
  const fs=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm');
  landmarker=await FaceLandmarker.createFromOptions(fs,{
    baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',delegate:'GPU'},
    outputFaceBlendshapes:true,runningMode:'VIDEO',numFaces:2
  });
}

function loop(){
  if(!running)return;requestAnimationFrame(loop);
  if(!landmarker||video.readyState<2)return;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(video.currentTime!==lastVideoTime){lastVideoTime=video.currentTime;lastResults=landmarker.detectForVideo(video,performance.now());}
  const faces=lastResults?.faceLandmarks||[],blends=lastResults?.faceBlendshapes||[];
  if(faces.length){
    document.getElementById('face-status').textContent=faces.length>1?`${faces.length} פנים ✓`:'פנים זוהו ✓';
    document.getElementById('no-face').classList.remove('show');
    if(currentFilter!=='none')faces.forEach((lm,i)=>drawFilter(lm,blends[i]?.categories||[]));
  } else {
    document.getElementById('face-status').textContent='מחפש פנים...';
    if(currentFilter!=='none')document.getElementById('no-face').classList.add('show');
  }
}

function bs(cats,name){const c=cats.find(c=>c.categoryName===name);return c?c.score:0;}
function pt(lm,i){return{x:(1-lm[i].x)*canvas.width,y:lm[i].y*canvas.height};}

function M(lm){
  const le=pt(lm,468),re=pt(lm,473),nt=pt(lm,4),nb=pt(lm,1),ch=pt(lm,152),th=pt(lm,10),
        lj=pt(lm,234),rj=pt(lm,454),ml=pt(lm,61),mr=pt(lm,291),
        mt=pt(lm,13),mb=pt(lm,14),ul=pt(lm,0),ll=pt(lm,17);
  const fw=Math.abs(rj.x-lj.x),fh=Math.abs(ch.y-th.y),cx=(lj.x+rj.x)/2,cy=th.y;
  return{leftEye:le,rightEye:re,noseTip:nt,noseBase:nb,chin:ch,topHead:th,leftJaw:lj,rightJaw:rj,
         mouthL:ml,mouthR:mr,mouthTop:mt,mouthBot:mb,upperLip:ul,lowerLip:ll,fw,fh,cx,cy};
}

const T=()=>Date.now()/1000;

function star(x,y,n,R,r,col,glow=0){
  ctx.save();if(glow){ctx.shadowColor=col;ctx.shadowBlur=glow;}
  ctx.translate(x,y);ctx.beginPath();
  for(let i=0;i<n*2;i++){const rad=i%2===0?R:r,a=i*Math.PI/n-Math.PI/2;i===0?ctx.moveTo(rad*Math.cos(a),rad*Math.sin(a)):ctx.lineTo(rad*Math.cos(a),rad*Math.sin(a));}
  ctx.closePath();ctx.fillStyle=col;ctx.fill();ctx.restore();
}
function blush(x,y,fw,col='rgba(255,110,155,0.55)'){
  const g=ctx.createRadialGradient(x,y,0,x,y,fw*.14);g.addColorStop(0,col);g.addColorStop(1,'rgba(255,110,155,0)');
  ctx.beginPath();ctx.ellipse(x,y,fw*.14,fw*.09,0,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
}
function heart(x,y,s,c,a=1){
  ctx.save();ctx.globalAlpha=a;ctx.translate(x,y);ctx.rotate(Math.PI);
  ctx.beginPath();ctx.moveTo(0,s*.25);ctx.bezierCurveTo(-s*.5,-s*.1,-s,s*.1,0,s);ctx.bezierCurveTo(s,s*.1,s*.5,-s*.1,0,s*.25);
  ctx.fillStyle=c;ctx.fill();ctx.restore();
}

function drawFilter(lm,bsData){
  const m=M(lm);
  const mo=bs(bsData,'jawOpen'),blL=bs(bsData,'eyeBlinkLeft'),blR=bs(bsData,'eyeBlinkRight'),
        brU=bs(bsData,'browInnerUp'),sm=bs(bsData,'mouthSmileLeft')+bs(bsData,'mouthSmileRight');
  const b={mo,blL,blR,brU,sm};
  const F={
    unicorn:drawUnicorn,kawaii:drawKawaii,catgirl:drawCatGirl,bunny:drawBunny,
    butterfly:drawButterfly,mermaid:drawMermaid,fairy:drawFairy,tiara:drawTiara,
    flowers:drawFlowers,hearts:drawHearts,rainbow:drawRainbow,stars:drawStars,
    glitter:drawGlitter,bear:drawBear,disco:drawDisco,fire:drawFire,
    devil:drawDevil,alien:drawAlien,clown:drawClown,nerd:drawNerd,
    crown:drawCrown,glasses:drawGlasses,mustache:drawMustache,dog:drawDog
  };
  if(F[currentFilter])F[currentFilter](m,b);
}

// ════════════════════════════════════ FILTERS ════════════════════════════════

function drawUnicorn({cx,cy,fw,fh,topHead,leftEye,rightEye,mouthBot},{mo,blL,blR}){
  const t=T();
  [[-fw*.3],[fw*.3]].forEach(([ox],i)=>{
    ctx.save();ctx.translate(cx+ox,cy-fh*.02);
    ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(ox<0?-fw*.13:fw*.13,-fh*.32);ctx.lineTo(ox<0?fw*.1:-fw*.1,-fh*.05);ctx.closePath();
    const eg=ctx.createLinearGradient(0,0,0,-fh*.32);eg.addColorStop(0,'#ffd6f0');eg.addColorStop(1,'#ffb0e0');
    ctx.fillStyle=eg;ctx.fill();ctx.strokeStyle='#e080c0';ctx.lineWidth=2;ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,-fh*.04);ctx.lineTo(ox<0?-fw*.065:fw*.065,-fh*.22);ctx.lineTo(ox<0?fw*.04:-fw*.04,-fh*.06);ctx.closePath();
    ctx.fillStyle='#ff70bb';ctx.fill();ctx.restore();
  });
  ctx.save();ctx.translate(cx,cy-fh*.04);
  const hH=fh*.65,hW=fw*.08;
  ['#ff6eb4','#ff9f40','#ffed47','#7dff7d','#6ec6ff','#d47dff'].forEach((c,i,a)=>{
    const seg=hH/a.length,f=i/a.length,w=hW*(1-f);
    ctx.beginPath();ctx.moveTo(-w,-seg*i);ctx.lineTo(w,-seg*i);ctx.lineTo(0,-seg*(i+1));ctx.closePath();ctx.fillStyle=c;ctx.fill();
  });
  ctx.beginPath();ctx.moveTo(-hW*.18,0);ctx.lineTo(-hW*.06,-hH*.85);ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=hW*.28;ctx.lineCap='round';ctx.stroke();
  ctx.restore();
  for(let i=0;i<10;i++){
    const a=t*1.5+i*Math.PI/5,r=fw*.32;
    star(cx+Math.cos(a)*r,cy-fh*.32+Math.sin(a)*r*.5,4,fw*.032*(.6+.4*Math.sin(t*3+i)),fw*.013,['#ffecf7','#ffe4ff','#c8f4ff','#fdffc4'][i%4],10);
  }
  if(mo>.4){
    const mx=mouthBot.x,my=mouthBot.y+fw*.06;
    ctx.save();ctx.globalAlpha=mo*.9;
    ['#ff0055','#ff7700','#ffee00','#00cc44','#0088ff','#8800ff'].forEach((c,i)=>{
      ctx.beginPath();ctx.arc(mx,my,fw*(mo*1.1)*(1-i*.12),Math.PI,0);ctx.strokeStyle=c;ctx.lineWidth=fw*.1;ctx.stroke();
    });
    ctx.restore();
  }
  [leftEye,rightEye].forEach((e,i)=>{
    if((i===0?blL:blR)>.5)heart(e.x,e.y,fw*.12,'#ff1a6e',(i===0?blL:blR));
  });
  blush(leftEye.x,leftEye.y+fw*.22,fw,'rgba(255,130,200,0.55)');
  blush(rightEye.x,rightEye.y+fw*.22,fw,'rgba(255,130,200,0.55)');
}

function drawKawaii({leftEye,rightEye,noseTip,mouthL,mouthR,mouthBot,fw},{mo,blL,blR,sm}){
  const t=T();
  [leftEye,rightEye].forEach((e,i)=>{
    const bl=i===0?blL:blR,er=fw*.14;
    ctx.save();
    ctx.beginPath();ctx.ellipse(e.x,e.y,er*1.12,er*(1.22-bl*.95),0,0,Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,.95)';ctx.fill();ctx.strokeStyle='#222';ctx.lineWidth=fw*.024;ctx.stroke();
    if(bl<.6){
      const ig=ctx.createRadialGradient(e.x,e.y-er*.1,0,e.x,e.y,er*.92);
      ig.addColorStop(0,i===0?'#ff90cc':'#90c0ff');ig.addColorStop(.5,i===0?'#cc0066':'#0055cc');ig.addColorStop(1,'#0a0020');
      ctx.beginPath();ctx.ellipse(e.x,e.y,er*.9,er*(1.06-bl*.9),0,0,Math.PI*2);ctx.fillStyle=ig;ctx.fill();
      ctx.beginPath();ctx.ellipse(e.x+er*.1,e.y+er*.08,er*.4,er*.45,0,0,Math.PI*2);ctx.fillStyle='#060010';ctx.fill();
      ctx.beginPath();ctx.ellipse(e.x-er*.33,e.y-er*.32,er*.3,er*.38,-.3,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,.95)';ctx.fill();
      ctx.beginPath();ctx.arc(e.x+er*.2,e.y-er*.1,er*.13,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,.75)';ctx.fill();
      star(e.x-er*.05,e.y+er*.22,4,er*.13,er*.05,'rgba(255,255,255,.55)');
    }
    ctx.beginPath();ctx.ellipse(e.x,e.y-er*(1.1-bl*.95),er*1.14,er*.19,0,0,Math.PI*2);ctx.fillStyle='rgba(30,5,35,.9)';ctx.fill();
    ctx.restore();
  });
  star(noseTip.x,noseTip.y,4,fw*.034,fw*.014,'#ffb3d9');
  blush(leftEye.x,leftEye.y+fw*.24,fw,'rgba(255,100,155,0.62)');
  blush(rightEye.x,rightEye.y+fw*.24,fw,'rgba(255,100,155,0.62)');
  const mx=(mouthL.x+mouthR.x)*.5,my=(mouthL.y+mouthR.y)*.5;
  ctx.save();
  if(mo>.3){
    ctx.beginPath();ctx.ellipse(mx,my,fw*(.065+fw*.13*mo/fw),fw*(.055+fw*.15*mo/fw),0,0,Math.PI*2);
    ctx.fillStyle='#330022';ctx.fill();ctx.strokeStyle='#cc3366';ctx.lineWidth=fw*.022;ctx.stroke();
    for(let n=0;n<3;n++){
      ctx.fillStyle='#ff80cc';ctx.font=`bold ${fw*.1}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(['♪','♫','♬'][n],mx+(n-1)*fw*.2,my-fw*.28-Math.sin(t*3+n)*fw*.09);
    }
  } else {
    ctx.beginPath();ctx.moveTo(mx-fw*.1,my);ctx.bezierCurveTo(mx-fw*.05,my+fw*.07,mx+fw*.05,my+fw*.07,mx+fw*.1,my);
    ctx.strokeStyle='#cc3366';ctx.lineWidth=fw*.026;ctx.lineCap='round';ctx.stroke();
  }
  ctx.restore();
  if(sm>.6){
    for(let i=0;i<5;i++){
      const hx=mx+(i-2)*fw*.22,hy=my-fw*.3-Math.sin(t*2+i)*fw*.1;
      heart(hx,hy,fw*.06,['#ff4da6','#ff80bf','#ff1a8c','#ff99cc','#cc0066'][i],.82+.18*Math.sin(t+i));
    }
  }
}

function drawCatGirl({cx,cy,fw,fh,topHead,leftEye,rightEye,noseTip,mouthL,mouthR,chin},{mo,blL,blR}){

    const bl=i===0?blL:blR;ctx.save();ctx.translate(e.x,e.y);ctx.rotate(angle);
    ctx.beginPath();ctx.roundRect(-r,-r*.88,r*2,r*(1.76-bl*.82),r*.17);ctx.fillStyle=`rgba(0,60,180,${.2+bl*.1})`;ctx.fill();ctx.strokeStyle='#111';ctx.lineWidth=fw*.04;ctx.stroke();
    if(bl>.5){ctx.beginPath();ctx.moveTo(-r*.82,-r*.1);ctx.lineTo(r*.82,-r*.1);ctx.strokeStyle='#333';ctx.lineWidth=fw*.022;ctx.stroke();}
    ctx.restore();
  });
  const mx=(leftEye.x+rightEye.x)*.5,my=(leftEye.y+rightEye.y)*.5;ctx.save();ctx.translate(mx,my);ctx.rotate(angle);ctx.fillStyle='#f5f0e0';ctx.fillRect(-fw*.044,-fw*.016,fw*.088,fw*.032);ctx.strokeStyle='#ccc';ctx.lineWidth=1;ctx.strokeRect(-fw*.044,-fw*.016,fw*.088,fw*.032);ctx.strokeStyle='rgba(100,100,100,.5)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(-fw*.032,-fw*.016);ctx.lineTo(fw*.032,fw*.016);ctx.stroke();ctx.beginPath();ctx.moveTo(fw*.032,-fw*.016);ctx.lineTo(-fw*.032,fw*.016);ctx.stroke();ctx.restore();
  const c=Math.cos(angle),s=Math.sin(angle);ctx.strokeStyle='#111';ctx.lineWidth=fw*.032;ctx.lineCap='round';
  [[leftEye.x,leftEye.y,-1],[rightEye.x,rightEye.y,1]].forEach(([x,y,d])=>{ctx.beginPath();ctx.moveTo(x+d*c*r,y+d*s*r);ctx.lineTo(x+d*c*r*2.9,y+d*s*r*2.9);ctx.stroke();});
  if(mo>.35){['E=mc²','π=3.14','∑∞','√-1'].forEach((eq,i)=>{ctx.save();ctx.globalAlpha=mo*.82;ctx.fillStyle='#44aaff';ctx.font=`bold ${fw*.075}px monospace`;ctx.textAlign='center';ctx.fillText(eq,leftEye.x+(rightEye.x-leftEye.x)*(i*.3-.1),noseTip.y-fw*(mo*.55+.22+i*.2));ctx.restore();});}
  if(brU>.5){ctx.save();ctx.globalAlpha=brU;ctx.beginPath();ctx.arc(rightEye.x+fw*.16,rightEye.y-fw*.11,fw*.042,0,Math.PI*2);ctx.fillStyle='#88ccff';ctx.fill();ctx.beginPath();ctx.moveTo(rightEye.x+fw*.16,rightEye.y-fw*.15);ctx.lineTo(rightEye.x+fw*.24,rightEye.y-fw*.24);ctx.strokeStyle='#88ccff';ctx.lineWidth=fw*.026;ctx.lineCap='round';ctx.stroke();ctx.restore();}
}

function drawCrown({cx,fw,fh,topHead,leftEye,rightEye},{brU,blL,blR}){
  const t=T(),cw=fw*.98,ch=fh*.42;ctx.save();ctx.translate(cx,topHead.y);
  ctx.beginPath();ctx.moveTo(-cw/2,0);ctx.lineTo(-cw/2,-ch*.49);ctx.lineTo(-cw*.3,-ch*.84);ctx.lineTo(-cw*.1,-ch*.39);ctx.lineTo(0,-ch);ctx.lineTo(cw*.1,-ch*.39);ctx.lineTo(cw*.3,-ch*.84);ctx.lineTo(cw/2,-ch*.49);ctx.lineTo(cw/2,0);ctx.closePath();
  const cg=ctx.createLinearGradient(0,-ch,0,0);cg.addColorStop(0,'#FFF8DC');cg.addColorStop(.3,'#FFD700');cg.addColorStop(.7,'#FFA500');cg.addColorStop(1,'#CC7000');ctx.fillStyle=cg;ctx.fill();ctx.strokeStyle='#AA6600';ctx.lineWidth=fw*.017;ctx.stroke();
  [{x:0,y:-ch*.97,r:fw*.058,c:'#FF1493'},{x:-cw*.3,y:-ch*.8,r:fw*.042,c:'#00CED1'},{x:cw*.3,y:-ch*.8,r:fw*.042,c:'#00CED1'},{x:-cw*.12,y:-ch*.37,r:fw*.034,c:'#FF8C00'},{x:cw*.12,y:-ch*.37,r:fw*.034,c:'#FF8C00'},{x:-cw*.49,y:-ch*.06,r:fw*.024,c:'#AA44FF'},{x:cw*.49,y:-ch*.06,r:fw*.024,c:'#AA44FF'}].forEach(g=>{
    const pulse=Math.sin(t*2.5+g.x*.1)*.3+.7;ctx.save();ctx.shadowColor=g.c;ctx.shadowBlur=14*pulse;const gg=ctx.createRadialGradient(g.x-g.r*.35,g.y-g.r*.35,0,g.x,g.y,g.r);gg.addColorStop(0,'#fff');gg.addColorStop(.3,g.c);ctx.beginPath();ctx.arc(g.x,g.y,g.r,0,Math.PI*2);ctx.fillStyle=gg;ctx.fill();ctx.restore();
  });ctx.restore();
  if(brU>.4){for(let i=0;i<10;i++){const a2=t*3.5+i*Math.PI/5,r2=fw*(.55+brU*.18);star(cx+Math.cos(a2)*r2,topHead.y-ch*.65+Math.sin(a2)*r2*.32,5,fw*.045,fw*.018,'#FFD700',18);}}
  blush(leftEye.x,leftEye.y+fw*.21,fw,'rgba(255,200,100,0.4)');blush(rightEye.x,rightEye.y+fw*.21,fw,'rgba(255,200,100,0.4)');
}

function drawGlasses({leftEye,rightEye,fw},{blL,blR}){
  const r=fw*.16,angle=Math.atan2(rightEye.y-leftEye.y,rightEye.x-leftEye.x);
  [[leftEye.x,leftEye.y,blL],[rightEye.x,rightEye.y,blR]].forEach(([ex,ey,bl])=>{
    ctx.save();ctx.translate(ex,ey);ctx.rotate(angle);const lg=ctx.createLinearGradient(-r,-r*.8,r,r*.8);lg.addColorStop(0,'rgba(100,200,255,.36)');lg.addColorStop(1,'rgba(60,150,220,.18)');ctx.beginPath();ctx.ellipse(0,0,r,r*.84*(1-bl*.92),0,0,Math.PI*2);ctx.fillStyle=lg;ctx.fill();ctx.strokeStyle='#111';ctx.lineWidth=fw*.03;ctx.stroke();if(bl<.5){ctx.save();ctx.clip();ctx.beginPath();ctx.ellipse(-r*.3,-r*.36,r*.23,r*.12,.5,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,.46)';ctx.fill();ctx.restore();}ctx.restore();
  });
  const c=Math.cos(angle),s=Math.sin(angle);ctx.strokeStyle='#111';ctx.lineWidth=fw*.024;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(leftEye.x+c*r,leftEye.y+s*r);ctx.lineTo(rightEye.x-c*r,rightEye.y-s*r);ctx.stroke();[[leftEye.x,leftEye.y,-1],[rightEye.x,rightEye.y,1]].forEach(([x,y,d])=>{ctx.beginPath();ctx.moveTo(x-d*c*r,y-d*s*r);ctx.lineTo(x-d*c*r*2.7,y-d*s*r*2.7);ctx.stroke();});
}

function drawMustache({noseTip,mouthL,mouthR,fw},{mo}){
  const mx=(mouthL.x+mouthR.x)*.5,my=(noseTip.y+mouthL.y)*.48,w=fw*.58*(1-mo*.3),h=w*.45;
  ctx.save();ctx.translate(mx,my);
  ctx.beginPath();ctx.moveTo(0,0);ctx.bezierCurveTo(-w*.1,-h*.3,-w*.32,-h*.84,-w*.53,-h*.63);ctx.bezierCurveTo(-w*.63,-h*.53,-w*.57,h*.23,-w*.32,h*.33);ctx.bezierCurveTo(-w*.15,h*.43,-w*.05,h*.1,0,0);ctx.moveTo(0,0);ctx.bezierCurveTo(w*.1,-h*.3,w*.32,-h*.84,w*.53,-h*.63);ctx.bezierCurveTo(w*.63,-h*.53,w*.57,h*.23,w*.32,h*.33);ctx.bezierCurveTo(w*.15,h*.43,w*.05,h*.1,0,0);
  const mg=ctx.createLinearGradient(0,-h,0,h*.3);mg.addColorStop(0,'#3d2510');mg.addColorStop(1,'#1a0d05');ctx.fillStyle=mg;ctx.fill();ctx.restore();
}

function drawDog({cx,fw,fh,topHead,noseTip,leftEye,rightEye,mouthL,mouthR,chin},{mo,blL,blR}){
  const t=T();
  [[-fw*.38],[fw*.38]].forEach(([ox])=>{
    ctx.save();ctx.translate(cx+ox,topHead.y+fh*.06);ctx.rotate((ox<0?-.08:.08)+Math.sin(t*3+(ox<0?0:1))*.06);
    ctx.beginPath();ctx.ellipse(0,fh*.19,fw*.125,fh*.26,0,0,Math.PI*2);
    const eg=ctx.createRadialGradient(0,fh*.19,0,0,fh*.19,fh*.28);eg.addColorStop(0,'#d4a060');eg.addColorStop(1,'#8b5e28');ctx.fillStyle=eg;ctx.fill();ctx.strokeStyle='#7a4e1a';ctx.lineWidth=2;ctx.stroke();ctx.restore();
  });
  const {x:nx,y:ny}=noseTip;ctx.save();ctx.beginPath();ctx.ellipse(nx,ny,fw*.105,fw*.075,0,0,Math.PI*2);const ng=ctx.createRadialGradient(nx-fw*.032,ny-fw*.022,0,nx,ny,fw*.105);ng.addColorStop(0,'#555');ng.addColorStop(1,'#111');ctx.fillStyle=ng;ctx.fill();ctx.beginPath();ctx.arc(nx-fw*.032,ny-fw*.022,fw*.027,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,.5)';ctx.fill();[[-1],[1]].forEach(([d])=>{ctx.beginPath();ctx.ellipse(nx+d*fw*.055,ny+fw*.019,fw*.016,fw*.011,d*.4,0,Math.PI*2);ctx.fillStyle='rgba(0,0,0,.82)';ctx.fill();});ctx.restore();
  const mx=(mouthL.x+mouthR.x)*.5,my=(mouthL.y+mouthR.y)*.5;
  if(mo>.3){
    ctx.save();ctx.beginPath();ctx.ellipse(mx,my+fw*.04,fw*(.075+fw*.075*mo/fw),fw*(.065+fw*.13*mo/fw),0,0,Math.PI*2);ctx.fillStyle='rgba(10,0,5,.88)';ctx.fill();
    ctx.beginPath();ctx.ellipse(mx,my+fw*(.09+mo*.2),fw*.095,fw*(.13+mo*.13),0,0,Math.PI*2);
    const tg=ctx.createRadialGradient(mx,my+fw*.1,0,mx,my+fw*.13,fw*.13);tg.addColorStop(0,'#ff9999');tg.addColorStop(1,'#ee4466');ctx.fillStyle=tg;ctx.fill();
    ctx.beginPath();ctx.moveTo(mx,my+fw*.065);ctx.lineTo(mx,my+fw*(.09+mo*.3));ctx.strokeStyle='rgba(200,60,80,.62)';ctx.lineWidth=fw*.016;ctx.lineCap='round';ctx.stroke();ctx.restore();
  }
  [leftEye,rightEye].forEach((e,i)=>{ctx.save();ctx.globalAlpha=.58+(i===0?blL:blR)*.3;ctx.beginPath();ctx.ellipse(e.x+fw*.065,e.y-fw*.085,fw*.09,fw*.075,.4,0,Math.PI*2);ctx.fillStyle='rgba(120,70,20,.35)';ctx.fill();ctx.restore();});
  if(blL>.6||blR>.6){ctx.save();ctx.globalAlpha=.72;ctx.font=`${fw*.11}px sans-serif`;ctx.textAlign='center';ctx.fillText('!',cx+(blL>.6?-fw*.42:fw*.42),topHead.y+fh*.12);ctx.restore();}
  ctx.strokeStyle='rgba(255,240,200,.82)';ctx.lineWidth=1.7;ctx.lineCap='round';[[-1,-.1],[-1,.08],[1,-.1],[1,.08]].forEach(([d,a])=>{ctx.beginPath();ctx.moveTo(nx+d*fw*.04,ny+a*fw*.5);ctx.lineTo(nx+d*fw*.36,ny+a*fw*.5);ctx.stroke();});
}

// ── UI ──────────────────────────────────────────────────────────────────────
function setFilter(n){currentFilter=n;document.querySelectorAll('.filter-btn').forEach(b=>b.classList.toggle('active',b.dataset.filter===n));ctx.clearRect(0,0,canvas.width,canvas.height);}
window.setFilter=setFilter;
async function flipCamera(){facingMode=facingMode==='user'?'environment':'user';video.style.transform=facingMode==='user'?'scaleX(-1)':'scaleX(1)';await openCamera();}
window.flipCamera=flipCamera;
function capturePhoto(){document.getElementById('flash').classList.add('on');setTimeout(()=>document.getElementById('flash').classList.remove('on'),150);const tmp=document.createElement('canvas');tmp.width=canvas.width;tmp.height=canvas.height;const tc=tmp.getContext('2d');tc.save();if(facingMode==='user'){tc.translate(tmp.width,0);tc.scale(-1,1);}tc.drawImage(video,0,0,tmp.width,tmp.height);tc.restore();tc.drawImage(canvas,0,0);lastCaptured=tmp;savePhoto();}
window.capturePhoto=capturePhoto;
function savePhoto(){if(!lastCaptured){capturePhoto();return;}const a=document.createElement('a');a.download=`ar-${Date.now()}.png`;a.href=lastCaptured.toDataURL('image/png');a.click();}
window.savePhoto=savePhoto;
</script>
