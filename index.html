<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>AR מצלמה ✨</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@400;700;900&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#000; font-family:'Rubik',sans-serif; overflow:hidden; height:100dvh; }

  #app { position:relative; width:100vw; height:100dvh; }

  #video {
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    transform:scaleX(-1);
  }
  #overlay {
    position:absolute; inset:0;
    width:100%; height:100%;
    pointer-events:none;
  }

  /* TOP BAR */
  #topbar {
    position:absolute; top:0; left:0; right:0;
    padding:14px 18px;
    display:flex; align-items:center; justify-content:space-between;
    background:linear-gradient(to bottom,rgba(0,0,0,0.55),transparent);
    z-index:10;
  }
  #app-title { font-size:20px; font-weight:900; color:#fff; letter-spacing:-0.5px; }
  #face-status {
    font-size:12px; color:rgba(255,255,255,0.8);
    background:rgba(255,255,255,0.13);
    padding:5px 12px; border-radius:20px;
    backdrop-filter:blur(8px);
  }

  /* FILTERS BAR */
  #filters-bar {
    position:absolute; bottom:108px; left:0; right:0;
    display:flex; gap:10px; padding:0 14px;
    overflow-x:auto; scrollbar-width:none; z-index:10;
  }
  #filters-bar::-webkit-scrollbar { display:none; }

  .filter-btn {
    flex-shrink:0; width:64px; height:64px;
    border-radius:16px;
    border:2.5px solid rgba(255,255,255,0.18);
    background:rgba(15,15,25,0.72);
    backdrop-filter:blur(10px);
    display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:3px;
    cursor:pointer; transition:all 0.18s;
    font-size:24px; color:#fff;
    -webkit-tap-highlight-color:transparent;
  }
  .filter-btn span.label { font-size:9px; font-weight:700; color:rgba(255,255,255,0.8); }
  .filter-btn.active {
    border-color:#ff3cac;
    background:rgba(255,60,172,0.22);
    box-shadow:0 0 14px rgba(255,60,172,0.45);
    transform:scale(1.08);
  }

  /* BOTTOM CONTROLS */
  #bottom-controls {
    position:absolute; bottom:0; left:0; right:0; height:100px;
    display:flex; align-items:center; justify-content:center; gap:26px;
    background:linear-gradient(to top,rgba(0,0,0,0.7),transparent);
    z-index:10; padding-bottom:8px;
  }
  #capture-btn {
    width:70px; height:70px; border-radius:50%;
    border:4px solid #fff;
    background:rgba(255,255,255,0.15);
    cursor:pointer; position:relative;
    display:flex; align-items:center; justify-content:center;
    -webkit-tap-highlight-color:transparent;
  }
  #capture-btn::after {
    content:''; width:52px; height:52px;
    border-radius:50%; background:#fff;
    transition:all 0.12s;
  }
  #capture-btn:active::after { width:42px; height:42px; }
  #flip-btn, #save-btn {
    width:46px; height:46px; border-radius:50%;
    border:none; background:rgba(255,255,255,0.15);
    backdrop-filter:blur(8px); color:#fff;
    font-size:20px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    -webkit-tap-highlight-color:transparent;
  }

  /* LOADING */
  #loading {
    position:absolute; inset:0;
    background:linear-gradient(135deg,#0a0a18,#15002a);
    display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:18px;
    z-index:100;
  }
  #loading.hidden { display:none; }
  #loading-emoji { font-size:64px; animation:bounce 1s infinite alternate; }
  @keyframes bounce { from{transform:scale(1)} to{transform:scale(1.15)} }
  #loading-text { font-size:18px; font-weight:700; color:#fff; }
  #loading-sub { font-size:13px; color:rgba(255,255,255,0.5); }
  .bar-wrap {
    width:200px; height:6px;
    background:rgba(255,255,255,0.1); border-radius:3px; overflow:hidden;
  }
  #progress-bar {
    height:100%; width:0%; border-radius:3px;
    background:linear-gradient(90deg,#ff3cac,#784ba0,#2b86c5);
    transition:width 0.3s;
  }

  /* FLASH */
  #flash {
    position:absolute; inset:0; background:#fff;
    opacity:0; pointer-events:none; z-index:50;
    transition:opacity 0.08s;
  }
  #flash.on { opacity:0.85; }

  /* NO FACE */
  #no-face {
    position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%);
    color:rgba(255,255,255,0.6); font-size:13px; font-weight:700;
    background:rgba(0,0,0,0.45); padding:9px 18px;
    border-radius:18px; backdrop-filter:blur(8px);
    opacity:0; transition:opacity 0.3s; pointer-events:none;
    white-space:nowrap;
  }
  #no-face.show { opacity:1; }

  /* PERMISSION */
  #permission-screen {
    position:absolute; inset:0;
    background:linear-gradient(135deg,#0a0a18 0%,#15002a 100%);
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:18px; z-index:200; padding:40px; text-align:center;
  }
  #permission-screen.hidden { display:none; }
  .perm-icon { font-size:72px; }
  .perm-title { font-size:26px; font-weight:900; color:#fff; }
  .perm-desc { font-size:14px; color:rgba(255,255,255,0.55); line-height:1.6; max-width:270px; }
  #start-btn {
    margin-top:8px; padding:15px 38px;
    border-radius:28px; border:none;
    background:linear-gradient(135deg,#ff3cac,#784ba0,#2b86c5);
    color:#fff; font-family:'Rubik',sans-serif;
    font-size:17px; font-weight:700; cursor:pointer;
    box-shadow:0 8px 28px rgba(255,60,172,0.4);
    transition:all 0.2s;
  }
  #start-btn:active { transform:scale(0.96); }
</style>
</head>
<body>
<div id="app">

  <!-- Permission -->
  <div id="permission-screen">
    <div class="perm-icon">📸</div>
    <div class="perm-title">AR מצלמה ✨</div>
    <div class="perm-desc">אפקטים מגניבים על הפנים שלך בזמן אמת!</div>
    <button id="start-btn" onclick="init()">פתח מצלמה 🎉</button>
  </div>

  <!-- Loading -->
  <div id="loading">
    <div id="loading-emoji">🤳</div>
    <div id="loading-text">טוען...</div>
    <div id="loading-sub">רק רגע אחד</div>
    <div class="bar-wrap"><div id="progress-bar"></div></div>
  </div>

  <video id="video" autoplay muted playsinline></video>
  <canvas id="overlay"></canvas>
  <div id="flash"></div>
  <div id="no-face">📷 הצב את הפנים במסגרת</div>

  <div id="topbar">
    <div id="app-title">✨ AR מצלמה</div>
    <div id="face-status">ממתין...</div>
  </div>

  <div id="filters-bar">
    <div class="filter-btn active" onclick="setFilter('none')" data-filter="none"><span>🚫</span><span class="label">ללא</span></div>
    <div class="filter-btn" onclick="setFilter('mustache')" data-filter="mustache"><span>👨</span><span class="label">שפם</span></div>
    <div class="filter-btn" onclick="setFilter('glasses')" data-filter="glasses"><span>🕶️</span><span class="label">משקפיים</span></div>
    <div class="filter-btn" onclick="setFilter('nose')" data-filter="nose"><span>🐽</span><span class="label">אף כלב</span></div>
    <div class="filter-btn" onclick="setFilter('clown')" data-filter="clown"><span>🤡</span><span class="label">ליצן</span></div>
    <div class="filter-btn" onclick="setFilter('alien')" data-filter="alien"><span>👽</span><span class="label">חייזר</span></div>
    <div class="filter-btn" onclick="setFilter('crown')" data-filter="crown"><span>👑</span><span class="label">כתר</span></div>
    <div class="filter-btn" onclick="setFilter('fire')" data-filter="fire"><span>🔥</span><span class="label">אש</span></div>
    <div class="filter-btn" onclick="setFilter('nerd')" data-filter="nerd"><span>🤓</span><span class="label">נרד</span></div>
    <div class="filter-btn" onclick="setFilter('bunny')" data-filter="bunny"><span>🐰</span><span class="label">ארנב</span></div>
    <div class="filter-btn" onclick="setFilter('unicorn')" data-filter="unicorn"><span>🦄</span><span class="label">חד קרן</span></div>
    <div class="filter-btn" onclick="setFilter('butterfly')" data-filter="butterfly"><span>🦋</span><span class="label">פרפר</span></div>
    <div class="filter-btn" onclick="setFilter('flowers')" data-filter="flowers"><span>🌸</span><span class="label">פרחים</span></div>
    <div class="filter-btn" onclick="setFilter('hearts')" data-filter="hearts"><span>💖</span><span class="label">לבבות</span></div>
    <div class="filter-btn" onclick="setFilter('rainbow')" data-filter="rainbow"><span>🌈</span><span class="label">קשת</span></div>
    <div class="filter-btn" onclick="setFilter('catgirl')" data-filter="catgirl"><span>🐱</span><span class="label">חתולה</span></div>
    <div class="filter-btn" onclick="setFilter('fairy')" data-filter="fairy"><span>🧚</span><span class="label">פיה</span></div>
    <div class="filter-btn" onclick="setFilter('stars')" data-filter="stars"><span>⭐</span><span class="label">כוכבים</span></div>
    <div class="filter-btn" onclick="setFilter('tiara')" data-filter="tiara"><span>👸</span><span class="label">נסיכה</span></div>
    <div class="filter-btn" onclick="setFilter('mermaid')" data-filter="mermaid"><span>🧜</span><span class="label">בת ים</span></div>
    <div class="filter-btn" onclick="setFilter('glitter')" data-filter="glitter"><span>✨</span><span class="label">גליטר</span></div>
    <div class="filter-btn" onclick="setFilter('kawaii')" data-filter="kawaii"><span>🥺</span><span class="label">קוואי</span></div>
    <div class="filter-btn" onclick="setFilter('disco')" data-filter="disco"><span>🪩</span><span class="label">דיסקו</span></div>
    <div class="filter-btn" onclick="setFilter('bear')" data-filter="bear"><span>🐻</span><span class="label">דובי</span></div>
    <div class="filter-btn" onclick="setFilter('devil')" data-filter="devil"><span>😈</span><span class="label">שד</span></div>
  </div>

  <div id="bottom-controls">
    <button id="flip-btn" onclick="flipCamera()">🔄</button>
    <button id="capture-btn" onclick="capturePhoto()"></button>
    <button id="save-btn" onclick="savePhoto()">💾</button>
  </div>
</div>

<script type="module">
import vision from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/+esm';
const { FaceLandmarker, FilesetResolver, DrawingUtils } = vision;

// ── STATE ──────────────────────────────────────────────
let video, canvas, ctx;
let faceLandmarker = null;
let currentFilter = 'none';
let facingMode = 'user';
let stream = null;
let lastCaptured = null;
let lastResults = null;
let running = false;

// ── BOOT ───────────────────────────────────────────────
async function init() {
  document.getElementById('permission-screen').classList.add('hidden');
  video  = document.getElementById('video');
  canvas = document.getElementById('overlay');
  ctx    = canvas.getContext('2d');
  window.addEventListener('resize', resizeCanvas);

  setProgress(10, '📷 פותח מצלמה...');
  await openCamera();
  setProgress(40, '🧠 טוען זיהוי פנים...');
  await loadLandmarker();
  setProgress(100, '✅ מוכן!');
  setTimeout(() => {
    document.getElementById('loading').classList.add('hidden');
    running = true;
    requestAnimationFrame(renderLoop);
  }, 400);
}
window.init = init;

function setProgress(pct, text) {
  document.getElementById('progress-bar').style.width = pct + '%';
  document.getElementById('loading-text').textContent = text;
}

// ── CAMERA ─────────────────────────────────────────────
async function openCamera() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode, width:{ideal:1280}, height:{ideal:720} },
    audio: false
  });
  video.srcObject = stream;
  await new Promise(r => { video.onloadedmetadata = r; });
  resizeCanvas();
}

function resizeCanvas() {
  canvas.width  = video.clientWidth  || window.innerWidth;
  canvas.height = video.clientHeight || window.innerHeight;
}

// ── MEDIAPIPE ──────────────────────────────────────────
async function loadLandmarker() {
  const filesetResolver = await FilesetResolver.forVisionTasks(
    'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm'
  );
  faceLandmarker = await FaceLandmarker.createFromOptions(filesetResolver, {
    baseOptions: {
      modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',
      delegate: 'GPU'
    },
    outputFaceBlendshapes: false,
    runningMode: 'VIDEO',
    numFaces: 2
  });
}

// ── RENDER LOOP ────────────────────────────────────────
let lastVideoTime = -1;
function renderLoop() {
  if (!running) return;
  requestAnimationFrame(renderLoop);
  if (!faceLandmarker || video.readyState < 2) return;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    lastResults = faceLandmarker.detectForVideo(video, performance.now());
  }

  const faces = lastResults?.faceLandmarks || [];
  if (faces.length > 0) {
    document.getElementById('face-status').textContent = faces.length > 1 ? `${faces.length} פנים ✓` : 'פנים זוהו ✓';
    document.getElementById('no-face').classList.remove('show');
    if (currentFilter !== 'none') faces.forEach(lm => drawFilter(lm));
  } else {
    document.getElementById('face-status').textContent = 'מחפש פנים...';
    if (currentFilter !== 'none') document.getElementById('no-face').classList.add('show');
  }
}

// ── LANDMARK HELPERS ───────────────────────────────────
// MediaPipe returns normalized [0,1] coords
function px(lm, i) {
  // video is CSS-mirrored; flip x
  return { x: (1 - lm[i].x) * canvas.width, y: lm[i].y * canvas.height };
}
function midpoint(...idxs) {
  // helper used with already-converted screen points
  const pts = idxs;
  return { x: pts.reduce((s,p)=>s+p.x,0)/pts.length, y: pts.reduce((s,p)=>s+p.y,0)/pts.length };
}
function faceMetrics(lm) {
  // Key landmark indices for MediaPipe 478-point model
  const leftEye  = px(lm, 468); // left eye center (iris)
  const rightEye = px(lm, 473); // right eye center (iris)
  const noseTip  = px(lm, 1);
  const chin     = px(lm, 152);
  const topHead  = px(lm, 10);
  const leftJaw  = px(lm, 234);
  const rightJaw = px(lm, 454);
  const mouthTop = px(lm, 13);
  const mouthBot = px(lm, 14);
  const mouthL   = px(lm, 61);
  const mouthR   = px(lm, 291);

  const fw = Math.abs(rightJaw.x - leftJaw.x);
  const fh = Math.abs(chin.y - topHead.y);
  const cx = (leftJaw.x + rightJaw.x) / 2;
  return { leftEye, rightEye, noseTip, chin, topHead, leftJaw, rightJaw,
           mouthTop, mouthBot, mouthL, mouthR, fw, fh, cx };
}

// ── DRAW FILTER DISPATCHER ─────────────────────────────
function drawFilter(lm) {
  const m = faceMetrics(lm);
  switch(currentFilter) {
    case 'mustache':  drawMustache(m); break;
    case 'glasses':   drawGlasses(m); break;
    case 'nose':      drawDogNose(m); break;
    case 'clown':     drawClown(m); break;
    case 'alien':     drawAlien(m, lm); break;
    case 'crown':     drawCrown(m); break;
    case 'fire':      drawFire(m); break;
    case 'nerd':      drawNerdGlasses(m); break;
    case 'bunny':     drawBunny(m); break;
    case 'unicorn':   drawUnicorn(m); break;
    case 'butterfly': drawButterfly(m); break;
    case 'flowers':   drawFlowers(m); break;
    case 'hearts':    drawHearts(m); break;
    case 'rainbow':   drawRainbow(m); break;
    case 'catgirl':   drawCatGirl(m); break;
    case 'fairy':     drawFairy(m); break;
    case 'stars':     drawStarFilter(m); break;
    case 'tiara':     drawTiara(m); break;
    case 'mermaid':   drawMermaid(m); break;
    case 'glitter':   drawGlitter(m); break;
    case 'kawaii':    drawKawaii(m); break;
    case 'disco':     drawDisco(m); break;
    case 'bear':      drawBear(m); break;
    case 'devil':     drawDevil(m); break;
  }
}

// ── SHARED UTILS ───────────────────────────────────────
function drawStar(x, y, pts, outer, inner, color) {
  ctx.save();
  ctx.translate(x, y);
  ctx.beginPath();
  for (let i = 0; i < pts*2; i++) {
    const r = i%2===0 ? outer : inner;
    const a = i*Math.PI/pts - Math.PI/2;
    i===0 ? ctx.moveTo(r*Math.cos(a),r*Math.sin(a)) : ctx.lineTo(r*Math.cos(a),r*Math.sin(a));
  }
  ctx.closePath();
  ctx.fillStyle = color; ctx.fill();
  ctx.restore();
}

function rosyCheck(ex, ey, fw) {
  const gr = ctx.createRadialGradient(ex,ey,0,ex,ey,fw*0.12);
  gr.addColorStop(0,'rgba(255,120,160,0.5)');
  gr.addColorStop(1,'rgba(255,120,160,0)');
  ctx.beginPath(); ctx.ellipse(ex,ey,fw*0.12,fw*0.08,0,0,Math.PI*2);
  ctx.fillStyle=gr; ctx.fill();
}

// ═══════════════════════════════════════════════════════
// FILTER IMPLEMENTATIONS
// ═══════════════════════════════════════════════════════

function drawMustache({noseTip, mouthL, mouthR, fw}) {
  const mx = (mouthL.x+mouthR.x)/2;
  const my = (noseTip.y + mouthL.y) / 2;
  const w=fw*0.52, h=w*0.42;
  ctx.save(); ctx.translate(mx,my);
  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.bezierCurveTo(-w*.1,-h*.3,-w*.3,-h*.8,-w*.5,-h*.6);
  ctx.bezierCurveTo(-w*.6,-h*.5,-w*.55,h*.2,-w*.3,h*.3);
  ctx.bezierCurveTo(-w*.15,h*.4,-w*.05,h*.1,0,0);
  ctx.moveTo(0,0);
  ctx.bezierCurveTo(w*.1,-h*.3,w*.3,-h*.8,w*.5,-h*.6);
  ctx.bezierCurveTo(w*.6,-h*.5,w*.55,h*.2,w*.3,h*.3);
  ctx.bezierCurveTo(w*.15,h*.4,w*.05,h*.1,0,0);
  ctx.fillStyle='#2d1a0e'; ctx.fill();
  ctx.restore();
}

function drawGlasses({leftEye,rightEye,fw}) {
  const r=fw*0.15;
  const angle=Math.atan2(rightEye.y-leftEye.y, rightEye.x-leftEye.x);
  function lens(cx,cy) {
    ctx.save(); ctx.translate(cx,cy); ctx.rotate(angle);
    ctx.beginPath(); ctx.ellipse(0,0,r,r*.8,0,0,Math.PI*2);
    ctx.fillStyle='rgba(80,180,255,0.22)'; ctx.fill();
    ctx.strokeStyle='#111'; ctx.lineWidth=fw*.026; ctx.stroke();
    ctx.restore();
  }
  ctx.save();
  lens(leftEye.x,leftEye.y); lens(rightEye.x,rightEye.y);
  // bridge
  const c=Math.cos(angle), s=Math.sin(angle);
  ctx.beginPath();
  ctx.moveTo(leftEye.x+c*r, leftEye.y+s*r);
  ctx.lineTo(rightEye.x-c*r, rightEye.y-s*r);
  ctx.strokeStyle='#111'; ctx.lineWidth=fw*.02; ctx.stroke();
  // temples
  ctx.beginPath(); ctx.moveTo(leftEye.x-c*r,leftEye.y-s*r);
  ctx.lineTo(leftEye.x-c*r*2.5,leftEye.y-s*r*2.5); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(rightEye.x+c*r,rightEye.y+s*r);
  ctx.lineTo(rightEye.x+c*r*2.5,rightEye.y+s*r*2.5); ctx.stroke();
  ctx.restore();
}

function drawDogNose({noseTip,fw}) {
  const {x:nx,y:ny}=noseTip, r=fw*.11;
  ctx.save();
  ctx.beginPath(); ctx.ellipse(nx,ny,r,r*.7,0,0,Math.PI*2);
  const g=ctx.createRadialGradient(nx-r*.2,ny-r*.2,0,nx,ny,r);
  g.addColorStop(0,'#555'); g.addColorStop(1,'#111');
  ctx.fillStyle=g; ctx.fill();
  ctx.beginPath(); ctx.ellipse(nx-r*.3,ny-r*.2,r*.18,r*.11,-0.5,0,Math.PI*2);
  ctx.fillStyle='rgba(255,255,255,.5)'; ctx.fill();
  // snot
  ctx.beginPath(); ctx.moveTo(nx,ny+r*.5);
  ctx.bezierCurveTo(nx-r*.1,ny+r,nx+r*.1,ny+r*1.5,nx,ny+r*1.8);
  ctx.strokeStyle='rgba(80,200,40,.85)'; ctx.lineWidth=r*.22; ctx.lineCap='round'; ctx.stroke();
  ctx.beginPath(); ctx.arc(nx,ny+r*1.8,r*.14,0,Math.PI*2);
  ctx.fillStyle='rgba(80,200,40,.9)'; ctx.fill();
  ctx.restore();
}

function drawClown({noseTip,mouthL,mouthR,leftEye,rightEye,fw}) {
  const {x:nx,y:ny}=noseTip, nr=fw*.09;
  // red nose
  ctx.save();
  const ng=ctx.createRadialGradient(nx-nr*.3,ny-nr*.3,0,nx,ny,nr);
  ng.addColorStop(0,'#ff6b6b'); ng.addColorStop(1,'#cc0000');
  ctx.beginPath(); ctx.arc(nx,ny,nr,0,Math.PI*2);
  ctx.fillStyle=ng; ctx.fill();
  ctx.beginPath(); ctx.arc(nx-nr*.3,ny-nr*.3,nr*.18,0,Math.PI*2);
  ctx.fillStyle='rgba(255,255,255,.5)'; ctx.fill();
  ctx.restore();
  // smile
  const mx=(mouthL.x+mouthR.x)/2, my=(mouthL.y+mouthR.y)/2;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(mx-fw*.22,my-fw*.04);
  ctx.bezierCurveTo(mx-fw*.12,my+fw*.09,mx+fw*.12,my+fw*.09,mx+fw*.22,my-fw*.04);
  ctx.strokeStyle='#cc0000'; ctx.lineWidth=fw*.028; ctx.lineCap='round'; ctx.stroke();
  ctx.restore();
  // star eyes
  [leftEye,rightEye].forEach(e=>drawStar(e.x,e.y,5,fw*.11,fw*.05,'#FFD700'));
}

function drawAlien({topHead,leftJaw,rightJaw,leftEye,rightEye,fw,fh,cx}) {
  const tx=topHead.x, ty=topHead.y;
  ctx.save();
  ctx.fillStyle='rgba(50,210,50,.13)';
  ctx.fillRect(leftJaw.x,ty,fw,fh*1.1);
  const eyeY=ty+fh*.28;
  [leftEye.x,rightEye.x].forEach(ex=>{
    ctx.beginPath(); ctx.ellipse(ex,eyeY,fw*.19,fw*.14,-0.2,0,Math.PI*2);
    ctx.fillStyle='#000'; ctx.fill();
    ctx.beginPath(); ctx.ellipse(ex-fw*.06,eyeY-fw*.04,fw*.06,fw*.09,0,0,Math.PI*2);
    ctx.fillStyle='rgba(60,210,80,.65)'; ctx.fill();
    ctx.beginPath(); ctx.arc(ex-fw*.12,eyeY-fw*.08,fw*.04,0,Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,.7)'; ctx.fill();
  });
  // antenna
  ctx.beginPath(); ctx.moveTo(cx,ty); ctx.lineTo(cx,ty-fh*.22);
  ctx.strokeStyle='#2dcd2d'; ctx.lineWidth=fw*.02; ctx.stroke();
  ctx.beginPath(); ctx.arc(cx,ty-fh*.24,fw*.035,0,Math.PI*2);
  ctx.fillStyle='#afffaf'; ctx.fill();
  ctx.restore();
}

function drawCrown({topHead,leftJaw,rightJaw,fw,fh,cx}) {
  const cy=topHead.y, cw=fw*.9, ch=fh*.35;
  ctx.save(); ctx.translate(cx,cy);
  ctx.beginPath();
  ctx.moveTo(-cw/2,0); ctx.lineTo(-cw/2,-ch*.5);
  ctx.lineTo(-cw*.3,-ch*.8); ctx.lineTo(-cw*.1,-ch*.4);
  ctx.lineTo(0,-ch); ctx.lineTo(cw*.1,-ch*.4);
  ctx.lineTo(cw*.3,-ch*.8); ctx.lineTo(cw/2,-ch*.5);
  ctx.lineTo(cw/2,0); ctx.closePath();
  const g=ctx.createLinearGradient(0,-ch,0,0);
  g.addColorStop(0,'#FFD700'); g.addColorStop(.5,'#FFA500'); g.addColorStop(1,'#FF8C00');
  ctx.fillStyle=g; ctx.fill();
  ctx.strokeStyle='#B8860B'; ctx.lineWidth=fw*.015; ctx.stroke();
  [{x:0,y:-ch*.95,r:fw*.04,c:'#FF1493'},{x:-cw*.3,y:-ch*.75,r:fw*.03,c:'#00CED1'},
   {x:cw*.3,y:-ch*.75,r:fw*.03,c:'#00CED1'},{x:-cw*.15,y:-ch*.35,r:fw*.025,c:'#FF4500'},
   {x:cw*.15,y:-ch*.35,r:fw*.025,c:'#FF4500'}].forEach(j=>{
    const gg=ctx.createRadialGradient(j.x-j.r*.3,j.y-j.r*.3,0,j.x,j.y,j.r);
    gg.addColorStop(0,'#fff'); gg.addColorStop(.3,j.c);
    ctx.beginPath(); ctx.arc(j.x,j.y,j.r,0,Math.PI*2); ctx.fillStyle=gg; ctx.fill();
  });
  ctx.restore();
}

function drawFire({topHead,leftJaw,fw,fh,cx}) {
  const cy=topHead.y, t=Date.now()/280;
  ctx.save();
  for(let i=0;i<7;i++){
    const off=(i-3)*fw*.13, wave=Math.sin(t+i*1.3)*fw*.035;
    const h=fh*(.42+Math.sin(t*.7+i)*.1);
    const gx=cx+off+wave, gy=cy;
    const g=ctx.createRadialGradient(gx,gy,0,gx,gy-h*.5,h);
    g.addColorStop(0,'rgba(255,255,100,.95)'); g.addColorStop(.3,'rgba(255,140,0,.85)');
    g.addColorStop(.7,'rgba(255,30,0,.6)'); g.addColorStop(1,'rgba(150,0,0,0)');
    ctx.beginPath();
    ctx.moveTo(gx-fw*.06,gy);
    ctx.bezierCurveTo(gx-fw*.09+wave*.5,gy-h*.4,gx+fw*.04+wave,gy-h*.8,gx+wave*.3,gy-h);
    ctx.bezierCurveTo(gx-fw*.04,gy-h*.8,gx+fw*.09+wave*.5,gy-h*.4,gx+fw*.06,gy);
    ctx.fillStyle=g; ctx.fill();
  }
  ctx.restore();
}

function drawNerdGlasses({leftEye,rightEye,fw}) {
  const r=fw*.15, angle=Math.atan2(rightEye.y-leftEye.y,rightEye.x-leftEye.x);
  [[leftEye.x,leftEye.y],[rightEye.x,rightEye.y]].forEach(([cx,cy])=>{
    ctx.save(); ctx.translate(cx,cy); ctx.rotate(angle);
    ctx.beginPath(); ctx.roundRect(-r,-r*.8,r*2,r*1.6,r*.15);
    ctx.fillStyle='rgba(0,100,200,.22)'; ctx.fill();
    ctx.strokeStyle='#111'; ctx.lineWidth=fw*.034; ctx.stroke();
    ctx.restore();
  });
  const mx=(leftEye.x+rightEye.x)/2, my=(leftEye.y+rightEye.y)/2;
  ctx.save(); ctx.translate(mx,my); ctx.rotate(angle);
  ctx.fillStyle='#f5f0e0';
  ctx.fillRect(-fw*.04,-fw*.014,fw*.08,fw*.028);
  ctx.strokeStyle='#ccc'; ctx.lineWidth=1; ctx.strokeRect(-fw*.04,-fw*.014,fw*.08,fw*.028);
  ctx.restore();
  const c=Math.cos(angle), s=Math.sin(angle);
  ctx.strokeStyle='#111'; ctx.lineWidth=fw*.028; ctx.lineCap='round';
  [[leftEye.x,leftEye.y,-1],[rightEye.x,rightEye.y,1]].forEach(([x,y,d])=>{
    ctx.beginPath(); ctx.moveTo(x+d*c*r,y+d*s*r);
    ctx.lineTo(x+d*c*r*2.7,y+d*s*r*2.7); ctx.stroke();
  });
}

function drawBunny({topHead,leftJaw,rightJaw,noseTip,fw,fh,cx}) {
  const cy=topHead.y;
  [[-fw*.25,0],[fw*.25,0]].forEach(([ox])=>{
    ctx.save(); ctx.translate(cx+ox,cy);
    ctx.beginPath(); ctx.ellipse(0,-fh*.28,fw*.1,fh*.3,0,0,Math.PI*2);
    ctx.fillStyle='#f0f0f0'; ctx.fill(); ctx.strokeStyle='#ddd'; ctx.lineWidth=2; ctx.stroke();
    ctx.beginPath(); ctx.ellipse(0,-fh*.28,fw*.055,fh*.22,0,0,Math.PI*2);
    ctx.fillStyle='#ffb6c1'; ctx.fill();
    ctx.restore();
  });
  const {x:nx,y:ny}=noseTip;
  ctx.beginPath(); ctx.ellipse(nx,ny,fw*.038,fw*.028,0,0,Math.PI*2);
  ctx.fillStyle='#ff69b4'; ctx.fill();
  ctx.strokeStyle='rgba(200,200,200,.8)'; ctx.lineWidth=1.5;
  [[-1,-.15],[-1,0],[-1,.15],[1,-.15],[1,0],[1,.15]].forEach(([d,a])=>{
    ctx.beginPath(); ctx.moveTo(nx,ny);
    ctx.lineTo(nx+d*fw*.24*Math.cos(a*Math.PI),ny+fw*.24*Math.sin(a*Math.PI)); ctx.stroke();
  });
}

function drawUnicorn({topHead,fw,fh,cx,leftEye,rightEye}) {
  const cy=topHead.y, t=Date.now()/600;
  // ears
  [[-fw*.28,0],[fw*.28,0]].forEach(([ox])=>{
    ctx.save(); ctx.translate(cx+ox,cy);
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-fw*.09,-fh*.26); ctx.lineTo(fw*.09,-fh*.26); ctx.closePath();
    ctx.fillStyle='#ffe0f0'; ctx.fill(); ctx.strokeStyle='#ffb6d9'; ctx.lineWidth=2; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,-fh*.03); ctx.lineTo(-fw*.05,-fh*.19); ctx.lineTo(fw*.05,-fh*.19); ctx.closePath();
    ctx.fillStyle='#ff80c0'; ctx.fill();
    ctx.restore();
  });
  // rainbow horn
  ctx.save(); ctx.translate(cx,cy);
  const hornH=fh*.52, hornW=fw*.065;
  const cols=['#ff6eb4','#ff9f40','#ffed47','#7dff7d','#6ec6ff','#c97dff'];
  for(let i=cols.length-1;i>=0;i--){
    const seg=hornH/cols.length, frac=i/cols.length, w=hornW*(1-frac);
    ctx.beginPath(); ctx.moveTo(-w,-seg*i); ctx.lineTo(w,-seg*i); ctx.lineTo(0,-seg*(i+1)); ctx.closePath();
    ctx.fillStyle=cols[i]; ctx.fill();
  }
  ctx.restore();
  // sparkles
  for(let i=0;i<6;i++){
    const a=t+i*Math.PI/3, r=fw*.19;
    drawStar(cx+Math.cos(a)*r, topHead.y-fh*.28+Math.sin(a)*r*.5, 4, fw*.022, fw*.009, '#ffecf7');
  }
  rosyCheck(leftEye.x,leftEye.y+fw*.18,fw);
  rosyCheck(rightEye.x,rightEye.y+fw*.18,fw);
}

function drawButterfly({topHead,fw,fh,cx}) {
  const cy=topHead.y-fh*.12, t=Date.now()/400, flutter=Math.sin(t)*.18;
  ctx.save(); ctx.translate(cx,cy);
  [[1,1],[-1,1]].forEach(([sx])=>{
    ctx.save(); ctx.scale(sx,1); ctx.rotate(flutter);
    ctx.beginPath(); ctx.moveTo(0,0);
    ctx.bezierCurveTo(fw*.1,-fh*.25,fw*.5,-fh*.35,fw*.45,-fh*.1);
    ctx.bezierCurveTo(fw*.4,fh*.05,fw*.1,fh*.1,0,0);
    const g=ctx.createRadialGradient(fw*.2,-fh*.15,0,fw*.2,-fh*.1,fw*.3);
    g.addColorStop(0,'#ff80c0'); g.addColorStop(.6,'#ff40a0'); g.addColorStop(1,'rgba(255,100,180,.2)');
    ctx.fillStyle=g; ctx.fill(); ctx.strokeStyle='#cc40a0'; ctx.lineWidth=1.5; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,0);
    ctx.bezierCurveTo(fw*.1,fh*.05,fw*.35,fh*.2,fw*.25,fh*.25);
    ctx.bezierCurveTo(fw*.1,fh*.3,-fw*.05,fh*.15,0,0);
    ctx.fillStyle='rgba(120,60,200,.55)'; ctx.fill(); ctx.stroke();
    ctx.restore();
  });
  ctx.restore();
}

function drawFlowers({topHead,leftJaw,rightJaw,leftEye,rightEye,fw,fh,cx}) {
  const t=Date.now()/1000;
  function flower(x,y,r,petals,c1,c2){
    ctx.save(); ctx.translate(x,y); ctx.rotate(t*.3);
    for(let i=0;i<petals;i++){
      const a=i/petals*Math.PI*2;
      ctx.beginPath(); ctx.ellipse(Math.cos(a)*r*.7,Math.sin(a)*r*.7,r*.44,r*.28,a,0,Math.PI*2);
      ctx.fillStyle=c1; ctx.fill();
    }
    ctx.beginPath(); ctx.arc(0,0,r*.35,0,Math.PI*2); ctx.fillStyle=c2; ctx.fill();
    ctx.restore();
  }
  const cols=[['#ff80c0','#ffed47'],['#ff4fa0','#ff9f40'],['#c060ff','#ff80c0'],
              ['#ff9f40','#fff'],['#7dff9d','#ffed47'],['#6ec6ff','#fff'],['#ff80c0','#ffed47']];
  for(let i=0;i<7;i++){
    const t2=i/6;
    const fx=leftJaw.x+(rightJaw.x-leftJaw.x)*t2;
    const fy=topHead.y-fw*.06;
    flower(fx,fy,fw*(0.062+.013*Math.sin(t*2+i)),5,...cols[i%cols.length]);
  }
  rosyCheck(leftEye.x,leftEye.y+fw*.18,fw);
  rosyCheck(rightEye.x,rightEye.y+fw*.18,fw);
}

function drawHearts({topHead,leftJaw,rightJaw,leftEye,rightEye,fw,cx}) {
  const t=Date.now()/500;
  function heart(x,y,s,c,a=1){
    ctx.save(); ctx.globalAlpha=a; ctx.translate(x,y); ctx.rotate(Math.PI);
    ctx.beginPath(); ctx.moveTo(0,s*.25);
    ctx.bezierCurveTo(-s*.5,-s*.1,-s,s*.1,0,s);
    ctx.bezierCurveTo(s,s*.1,s*.5,-s*.1,0,s*.25);
    ctx.fillStyle=c; ctx.fill(); ctx.restore();
  }
  const hcols=['#ff4da6','#ff80bf','#ff1a8c','#ff99cc','#cc0066'];
  [-fw*.4,-fw*.2,0,fw*.2,fw*.4].forEach((ox,i)=>{
    const fy=topHead.y-fw*.13-fw*.09*Math.sin(t+i*.7);
    heart(cx+ox,fy,fw*(0.057+0.018*Math.sin(t*1.5+i)),hcols[i],0.85+.15*Math.sin(t+i));
  });
  // heart eyes
  [leftEye,rightEye].forEach(e=>{
    heart(e.x,e.y,fw*.09,'#ff1a6e',.9);
    ctx.save(); ctx.globalAlpha=.7;
    ctx.beginPath(); ctx.arc(e.x-fw*.015,e.y-fw*.02,fw*.014,0,Math.PI*2);
    ctx.fillStyle='#fff'; ctx.fill(); ctx.restore();
  });
  rosyCheck(leftEye.x,leftEye.y+fw*.18,fw);
  rosyCheck(rightEye.x,rightEye.y+fw*.18,fw);
}

function drawRainbow({topHead,leftJaw,rightJaw,fw,cx}) {
  const cy=topHead.y, rx=fw*.72, t=Date.now()/700;
  ctx.save();
  ['#ff0000','#ff7700','#ffff00','#00cc44','#0088ff','#6600cc','#ff00aa'].forEach((c,i)=>{
    ctx.beginPath(); ctx.arc(cx,cy,rx*(1-i*.09),Math.PI,0);
    ctx.strokeStyle=c; ctx.lineWidth=rx*.1; ctx.stroke();
  });
  function cloud(x,y,s){
    ctx.fillStyle='rgba(255,255,255,.88)';
    [[-s*.5,0],[0,-s*.3],[s*.5,0],[0,s*.2]].forEach(([dx,dy])=>{
      ctx.beginPath(); ctx.arc(x+dx,y+dy,s*.55,0,Math.PI*2); ctx.fill();
    });
  }
  cloud(cx-rx,cy,fw*.09); cloud(cx+rx,cy,fw*.09);
  for(let i=0;i<5;i++){
    const a=t+i*1.3, sx=cx+Math.cos(a)*fw*.62, sy=cy-Math.abs(Math.sin(a))*fw*.55;
    if(sy<cy) drawStar(sx,sy,4,fw*.028,fw*.011,'#fff');
  }
  ctx.restore();
}

function drawCatGirl({topHead,noseTip,leftEye,rightEye,fw,fh,cx}) {
  const cy=topHead.y;
  [[-fw*.3,0],[fw*.3,0]].forEach(([ox],i)=>{
    ctx.save(); ctx.translate(cx+ox,cy-fh*.02);
    ctx.beginPath(); ctx.moveTo(0,0);
    ctx.lineTo(i===0?-fw*.14:fw*.14,-fh*.28);
    ctx.lineTo(i===0?fw*.07:-fw*.07,-fh*.05); ctx.closePath();
    ctx.fillStyle='#1a1a1a'; ctx.fill();
    ctx.beginPath(); ctx.moveTo(0,-fh*.02);
    ctx.lineTo(i===0?-fw*.07:fw*.07,-fh*.2);
    ctx.lineTo(i===0?fw*.03:-fw*.03,-fh*.06); ctx.closePath();
    ctx.fillStyle='#ff80c0'; ctx.fill();
    ctx.restore();
  });
  const {x:nx,y:ny}=noseTip;
  ctx.beginPath(); ctx.moveTo(nx,ny+fw*.022); ctx.lineTo(nx-fw*.028,ny-fw*.014); ctx.lineTo(nx+fw*.028,ny-fw*.014); ctx.closePath();
  ctx.fillStyle='#ff69b4'; ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.65)'; ctx.lineWidth=1.5; ctx.lineCap='round';
  [[-1,-.1],[-1,.1],[1,-.1],[1,.1]].forEach(([d,v])=>{
    ctx.beginPath(); ctx.moveTo(nx+d*fw*.04,ny+v*fw);
    ctx.lineTo(nx+d*fw*.3,ny+v*fw); ctx.stroke();
  });
  [leftEye,rightEye].forEach(e=>{
    ctx.save();
    ctx.beginPath(); ctx.ellipse(e.x,e.y,fw*.07,fw*.1,0,0,Math.PI*2);
    ctx.fillStyle='rgba(255,200,0,.7)'; ctx.fill();
    ctx.beginPath(); ctx.ellipse(e.x,e.y,fw*.02,fw*.09,0,0,Math.PI*2);
    ctx.fillStyle='rgba(0,0,0,.85)'; ctx.fill();
    ctx.restore();
  });
  rosyCheck(leftEye.x,leftEye.y+fw*.18,fw);
  rosyCheck(rightEye.x,rightEye.y+fw*.18,fw);
}

function drawFairy({topHead,chin,leftEye,rightEye,fw,fh,cx}) {
  const faceMidY=(topHead.y+chin.y)/2, t=Date.now()/500;
  [[-1,1],[1,-1]].forEach(([dir])=>{
    ctx.save(); ctx.translate(cx+dir*fw*.52,faceMidY);
    ctx.rotate(dir*.15+Math.sin(t+dir)*.08);
    ctx.beginPath(); ctx.moveTo(0,0);
    ctx.bezierCurveTo(dir*fw*.34,-fh*.28,dir*fw*.54,-fh*.14,dir*fw*.29,fh*.05);
    ctx.bezierCurveTo(dir*fw*.14,fh*.1,0,fh*.05,0,0);
    const g=ctx.createRadialGradient(dir*fw*.19,-fh*.1,0,dir*fw*.19,0,fw*.34);
    g.addColorStop(0,'rgba(200,150,255,.58)'); g.addColorStop(.5,'rgba(150,220,255,.38)'); g.addColorStop(1,'rgba(255,200,255,.08)');
    ctx.fillStyle=g; ctx.fill(); ctx.strokeStyle='rgba(180,100,255,.45)'; ctx.lineWidth=1; ctx.stroke();
    ctx.restore();
  });
  for(let i=0;i<10;i++){
    const a=t*1.2+i*.63, r=fw*(.14+.48*((i*.37)%1));
    const sx=cx+Math.cos(a)*r, sy=faceMidY+Math.sin(a)*r*.48-fh*.1;
    const ss=fw*.014*(.5+.5*Math.sin(t*3+i));
    ctx.save(); ctx.globalAlpha=.65+.35*Math.sin(t*2+i);
    drawStar(sx,sy,4,ss,ss*.4,['#ffecf7','#ffe0ff','#c8f0ff','#fff9c4'][i%4]);
    ctx.restore();
  }
  rosyCheck(leftEye.x,leftEye.y+fw*.18,fw);
  rosyCheck(rightEye.x,rightEye.y+fw*.18,fw);
}

function drawStarFilter({topHead,leftJaw,rightJaw,leftEye,rightEye,fw,fh,cx}) {
  const t=Date.now()/400;
  [leftEye,rightEye].forEach(e=>{
    const s=fw*.1;
    ctx.save(); ctx.shadowColor='#ffe600'; ctx.shadowBlur=12;
    drawStar(e.x,e.y,5,s,s*.42,'#ffe600'); ctx.restore();
    ctx.beginPath(); ctx.arc(e.x-s*.2,e.y-s*.25,s*.15,0,Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,.8)'; ctx.fill();

  for(let i=0;i<8;i++){
    const a=t*.8+i*Math.PI/4;
    const sx=cx+Math.cos(a)*fw*.58, sy=(topHead.y+fh*.4)+Math.sin(a)*fw*.42;
    const ss=fw*(.032+.018*Math.sin(t*3+i));
    ctx.save(); ctx.globalAlpha=.7+.3*Math.sin(t*2+i);
    drawStar(sx,sy,5,ss,ss*.4,['#ffe600','#ffb800','#fff9a0','#ffd700'][i%4]); ctx.restore();

function drawTiara({topHead,leftJaw,rightJaw,fw,fh,cx}) {
  const cy=topHead.y, cw=fw*.88, t=Date.now()/600;
  ctx.save(); ctx.translate(cx,cy);
  ctx.beginPath(); ctx.moveTo(-cw/2,0); ctx.lineTo(cw/2,0);
  ctx.strokeStyle='#d4af37'; ctx.lineWidth=fw*.024; ctx.stroke();
  [{x:0,h:fh*.36,c:'#FF1493'},{x:-cw*.22,h:fh*.21,c:'#00ced1'},{x:cw*.22,h:fh*.21,c:'#00ced1'},
   {x:-cw*.4,h:fh*.13,c:'#9400d3'},{x:cw*.4,h:fh*.13,c:'#9400d3'}].forEach(p=>{
    ctx.beginPath(); ctx.moveTo(p.x-cw*.022,0); ctx.lineTo(p.x,-p.h); ctx.lineTo(p.x+cw*.022,0);
    const g=ctx.createLinearGradient(p.x,0,p.x,-p.h);
    g.addColorStop(0,'#b8860b'); g.addColorStop(.5,'#ffd700'); g.addColorStop(1,'#fffacd');
    ctx.fillStyle=g; ctx.fill();
    const gr=fw*.048*(p.h/(fh*.36)), glow=Math.sin(t*2+p.x*.1)*.3+.7;
    ctx.save(); ctx.shadowColor=p.c; ctx.shadowBlur=8*glow;
    ctx.beginPath(); ctx.arc(p.x,-p.h,gr,0,Math.PI*2);
    const gg=ctx.createRadialGradient(p.x-gr*.3,-p.h-gr*.3,0,p.x,-p.h,gr);
    gg.addColorStop(0,'#fff'); gg.addColorStop(.3,p.c);
    ctx.fillStyle=gg; ctx.fill(); ctx.restore();
  });
  ctx.restore();
}

function drawMermaid({topHead,leftJaw,rightJaw,leftEye,rightEye,fw,fh,cx}) {
  const cy=topHead.y, t=Date.now()/600;
  ctx.save(); ctx.translate(cx,cy);
  [[-fw*.32,0],[0,0],[fw*.32,0]].forEach(([ox],i)=>{
    const cols=['#ff80bf','#40c8e0','#7b5ea7'];
    ctx.save(); ctx.translate(ox,-fw*.03);
    ctx.beginPath(); ctx.moveTo(0,fw*.02);
    for(let r=0;r<6;r++){
      const a=r/6*Math.PI+Math.PI, rad=fw*.09*(1-r/10);
      ctx.lineTo(Math.cos(a)*rad,-fw*.11+Math.sin(a)*rad*.6);
    }
    ctx.closePath(); ctx.fillStyle=cols[i]; ctx.fill();
    ctx.restore();
  });
  ctx.restore();
  [leftEye,rightEye].forEach(e=>{
    const g=ctx.createRadialGradient(e.x,e.y-fw*.04,0,e.x,e.y,fw*.12);
    g.addColorStop(0,'rgba(64,200,224,.58)'); g.addColorStop(.5,'rgba(123,94,167,.38)'); g.addColorStop(1,'rgba(255,128,191,0)');
    ctx.beginPath(); ctx.ellipse(e.x,e.y-fw*.03,fw*.12,fw*.07,0,0,Math.PI*2); ctx.fillStyle=g; ctx.fill();
  });
  // scales on cheeks
  [leftEye,rightEye].forEach(e=>{
    const ex=e.x, ey=e.y+fw*.17;
    for(let r=0;r<3;r++) for(let c=0;c<3;c++){
      ctx.save(); ctx.globalAlpha=.3+.3*Math.sin(t*2+r+c);
      ctx.beginPath(); ctx.ellipse(ex+(c-1)*fw*.05,ey+(r-1)*fw*.04,fw*.027,fw*.021,.3,0,Math.PI*2);
      ctx.fillStyle=['rgba(64,200,224,.5)','rgba(123,94,167,.5)','rgba(0,200,150,.5)'][(r+c)%3];
      ctx.fill(); ctx.restore();
    }
  });
}

function drawGlitter({topHead,chin,leftJaw,rightJaw,fw,fh,cx}) {
  const cy=(topHead.y+chin.y)/2, t=Date.now()/300;
  const gcols=['#ff80c0','#ffe600','#80ffff','#ff80ff','#80ff80','#fff','#ffb3de'];
  for(let i=0;i<35;i++){
    const seed=i*137.5, a=seed%360*Math.PI/180;
    const dist=fw*.18+(seed%50)/50*fw*.58;
    const gx=cx+Math.cos(a+t*.1)*dist, gy=cy+Math.sin(a+t*.1)*dist*.62;
    const gs=fw*(.009+(seed%3)*.007);
    if(Math.sin(t*2+seed)<.3) continue;
    ctx.save(); ctx.globalAlpha=.5+.5*Math.sin(t*3+i);
    ctx.strokeStyle=gcols[i%gcols.length]; ctx.lineWidth=gs*.8; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(gx-gs*2,gy); ctx.lineTo(gx+gs*2,gy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(gx,gy-gs*2); ctx.lineTo(gx,gy+gs*2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(gx-gs,gy-gs); ctx.lineTo(gx+gs,gy+gs); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(gx+gs,gy-gs); ctx.lineTo(gx-gs,gy+gs); ctx.stroke();
    ctx.restore();
  }
}

function drawKawaii({noseTip,mouthL,mouthR,leftEye,rightEye,fw}) {
  [leftEye,rightEye].forEach((e,i)=>{
    const er=fw*.1;
    ctx.save();
    ctx.beginPath(); ctx.ellipse(e.x,e.y,er*1.1,er*1.2,0,0,Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,.9)'; ctx.fill(); ctx.strokeStyle='#333'; ctx.lineWidth=fw*.018; ctx.stroke();
    const ig=ctx.createRadialGradient(e.x,e.y,0,e.x,e.y,er*.85);
    ig.addColorStop(0,i===0?'#ff80c0':'#80c0ff'); ig.addColorStop(1,i===0?'#cc0066':'#0040cc');
    ctx.beginPath(); ctx.ellipse(e.x,e.y,er*.85,er*.95,0,0,Math.PI*2); ctx.fillStyle=ig; ctx.fill();
    ctx.beginPath(); ctx.ellipse(e.x+er*.1,e.y+er*.1,er*.38,er*.42,0,0,Math.PI*2);
    ctx.fillStyle='#111'; ctx.fill();
    ctx.beginPath(); ctx.ellipse(e.x-er*.3,e.y-er*.3,er*.28,er*.36,-0.3,0,Math.PI*2);
    ctx.fillStyle='#fff'; ctx.fill();
    ctx.beginPath(); ctx.arc(e.x+er*.2,e.y-er*.1,er*.11,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill();
    drawStar(e.x-er*.05,e.y+er*.2,4,er*.11,er*.045,'rgba(255,255,255,.58)');
    ctx.restore();
  });
  const {x:nx,y:ny}=noseTip;
  drawStar(nx,ny,4,fw*.028,fw*.011,'#ffb3d9');
  [leftEye,rightEye].forEach(e=>{
    const ex=e.x, ey=e.y+fw*.2;
    const gr=ctx.createRadialGradient(ex,ey,0,ex,ey,fw*.13);
    gr.addColorStop(0,'rgba(255,110,150,.62)'); gr.addColorStop(1,'rgba(255,110,150,0)');
    ctx.beginPath(); ctx.ellipse(ex,ey,fw*.13,fw*.085,0,0,Math.PI*2); ctx.fillStyle=gr; ctx.fill();
    ctx.fillStyle='rgba(255,70,120,.48)';
    [-fw*.038,0,fw*.038].forEach(dx=>{
      ctx.beginPath(); ctx.arc(ex+dx,ey,fw*.009,0,Math.PI*2); ctx.fill();
    });
  });
  const mx=(mouthL.x+mouthR.x)/2, my=(mouthL.y+mouthR.y)/2-fw*.02;
  ctx.beginPath(); ctx.moveTo(mx-fw*.075,my);
  ctx.bezierCurveTo(mx-fw*.038,my+fw*.055,mx+fw*.038,my+fw*.055,mx+fw*.075,my);
  ctx.strokeStyle='#cc3366'; ctx.lineWidth=fw*.02; ctx.lineCap='round'; ctx.stroke();
}

function drawDisco({topHead,chin,leftEye,rightEye,fw,fh,cx}) {
  const faceMidY=(topHead.y+chin.y)/2, bx=cx, by=topHead.y-fh*.22, br=fw*.11, t=Date.now()/200;
  ctx.save();
  for(let i=0;i<8;i++){
    const a=i/8*Math.PI*2+t*.5, len=fw*.78, h=(i/8*360+t*30)%360;
    ctx.save(); ctx.globalAlpha=.38;
    const g=ctx.createLinearGradient(bx,by,bx+Math.cos(a)*len,by+Math.sin(a)*len);
    g.addColorStop(0,`hsla(${h},100%,60%,.8)`); g.addColorStop(1,`hsla(${h},100%,60%,0)`);
    ctx.beginPath(); ctx.moveTo(bx,by); ctx.lineTo(bx+Math.cos(a)*len,by+Math.sin(a)*len);
    ctx.strokeStyle=g; ctx.lineWidth=fw*.028; ctx.lineCap='round'; ctx.stroke(); ctx.restore();
  }
  ctx.beginPath(); ctx.arc(bx,by,br,0,Math.PI*2); ctx.fillStyle='#222'; ctx.fill();
  const ts=br*.27;
  for(let r=-3;r<=3;r++) for(let c=-3;c<=3;c++){
    const tx=bx+c*ts, ty=by+r*ts;
    if(Math.sqrt((tx-bx)**2+(ty-by)**2)>br*.9) continue;
    const h=((c+r+Math.floor(t))*40+180)%360;
    ctx.beginPath(); ctx.rect(tx-ts*.38,ty-ts*.38,ts*.76,ts*.76);
    ctx.fillStyle=`hsla(${h},80%,70%,.85)`; ctx.fill();
  }
  ctx.beginPath(); ctx.arc(bx,by,br,0,Math.PI*2); ctx.strokeStyle='rgba(255,255,255,.28)'; ctx.lineWidth=2; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(bx,by-br); ctx.lineTo(bx,topHead.y-fw*.04);
  ctx.strokeStyle='rgba(200,200,200,.55)'; ctx.lineWidth=2; ctx.stroke();
  for(let i=0;i<6;i++){
    const a=t*.7+i*1.05, r=fw*.38;
    const sx=cx+Math.cos(a)*r, sy=faceMidY+Math.sin(a)*r*.5;
    const h=(i*60+t*50)%360;
    ctx.save(); ctx.globalAlpha=.22;
    ctx.beginPath(); ctx.arc(sx,sy,fw*.075,0,Math.PI*2);
    ctx.fillStyle=`hsl(${h},100%,65%)`; ctx.fill(); ctx.restore();
  }
  ctx.restore();
}

function drawBear({topHead,noseTip,leftEye,rightEye,fw,fh,cx}) {
  const cy=topHead.y;
  [[-fw*.32,0],[fw*.32,0]].forEach(([ox])=>{
    ctx.save(); ctx.translate(cx+ox,cy-fh*.04);
    ctx.beginPath(); ctx.arc(0,0,fw*.13,0,Math.PI*2); ctx.fillStyle='#8B5E3C'; ctx.fill();
    ctx.beginPath(); ctx.arc(0,0,fw*.075,0,Math.PI*2); ctx.fillStyle='#c08060'; ctx.fill();
    ctx.restore();
  });
  const {x:nx,y:ny}=noseTip;
  ctx.beginPath(); ctx.ellipse(nx,ny+fw*.038,fw*.15,fw*.11,0,0,Math.PI*2);
  ctx.fillStyle='rgba(220,180,140,.68)'; ctx.fill();
  ctx.beginPath(); ctx.ellipse(nx,ny,fw*.055,fw*.038,0,0,Math.PI*2); ctx.fillStyle='#4a2800'; ctx.fill();
  ctx.beginPath(); ctx.arc(nx-fw*.018,ny-fw*.009,fw*.013,0,Math.PI*2); ctx.fillStyle='rgba(255,255,255,.5)'; ctx.fill();
  ctx.beginPath(); ctx.moveTo(nx,ny+fw*.014); ctx.lineTo(nx,ny+fw*.062);
  ctx.moveTo(nx-fw*.055,ny+fw*.062);
  ctx.bezierCurveTo(nx-fw*.036,ny+fw*.095,nx+fw*.036,ny+fw*.095,nx+fw*.055,ny+fw*.062);
  ctx.strokeStyle='#4a2800'; ctx.lineWidth=fw*.017; ctx.lineCap='round'; ctx.stroke();
  rosyCheck(leftEye.x,leftEye.y+fw*.18,fw);
  rosyCheck(rightEye.x,rightEye.y+fw*.18,fw);
}

function drawDevil({topHead,leftEye,rightEye,noseTip,mouthL,mouthR,fw,fh,cx}) {
  const cy=topHead.y, t=Date.now()/500;
  // Devil horns
  [[-fw*.28,0],[fw*.28,0]].forEach(([ox],i)=>{
    ctx.save(); ctx.translate(cx+ox,cy);
    ctx.beginPath(); ctx.moveTo(0,0);
    ctx.lineTo(i===0?-fw*.08:fw*.08,-fh*.32);
    ctx.lineTo(i===0?fw*.1:-fw*.1,-fh*.14);
    ctx.closePath();
    const g=ctx.createLinearGradient(0,0,0,-fh*.32);
    g.addColorStop(0,'#cc0000'); g.addColorStop(1,'#ff4444');
    ctx.fillStyle=g; ctx.fill(); ctx.strokeStyle='#880000'; ctx.lineWidth=2; ctx.stroke();
    ctx.restore();
  });
  // Glowing red eyes
  [leftEye,rightEye].forEach(e=>{
    ctx.save();
    ctx.shadowColor='#ff0000'; ctx.shadowBlur=14+6*Math.sin(t);
    ctx.beginPath(); ctx.ellipse(e.x,e.y,fw*.08,fw*.07,0,0,Math.PI*2);
    ctx.fillStyle=`rgba(220,0,0,${0.75+0.2*Math.sin(t)})`; ctx.fill();
    ctx.beginPath(); ctx.ellipse(e.x,e.y,fw*.03,fw*.06,0,0,Math.PI*2);
    ctx.fillStyle='#111'; ctx.fill();
    ctx.beginPath(); ctx.arc(e.x-fw*.025,e.y-fw*.025,fw*.016,0,Math.PI*2);
    ctx.fillStyle='rgba(255,100,100,.6)'; ctx.fill();
    ctx.restore();
  });
  // Evil grin
  const mx=(mouthL.x+mouthR.x)/2, my=(mouthL.y+mouthR.y)/2;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(mx-fw*.24,my-fw*.04);
  ctx.bezierCurveTo(mx-fw*.12,my+fw*.1,mx+fw*.12,my+fw*.1,mx+fw*.24,my-fw*.04);
  ctx.strokeStyle='#cc0000'; ctx.lineWidth=fw*.028; ctx.lineCap='round'; ctx.stroke();
  // Little fangs
  ctx.beginPath();
  ctx.moveTo(mx-fw*.06,my+fw*.02); ctx.lineTo(mx-fw*.04,my+fw*.07); ctx.lineTo(mx-fw*.02,my+fw*.02);
  ctx.moveTo(mx+fw*.02,my+fw*.02); ctx.lineTo(mx+fw*.04,my+fw*.07); ctx.lineTo(mx+fw*.06,my+fw*.02);
  ctx.fillStyle='#fff'; ctx.fill();
  ctx.restore();
  // Fire aura around head
  for(let i=0;i<5;i++){
    const a=t+i*1.25, r=fw*.55;
    const sx=cx+Math.cos(a)*r, sy=cy-fh*.1+Math.sin(a)*r*.38;
    const ss=fw*.03*(.6+.4*Math.sin(t*2+i));
    ctx.save(); ctx.globalAlpha=.55+.3*Math.sin(t*3+i);
    drawStar(sx,sy,4,ss,ss*.4,'#ff3300'); ctx.restore();
  }
}

// ── UI CONTROLS ────────────────────────────────────────
function setFilter(name) {
  currentFilter = name;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.filter===name));
  ctx.clearRect(0, 0, canvas.width, canvas.height);
}
window.setFilter = setFilter;

async function flipCamera() {
  facingMode = facingMode==='user' ? 'environment' : 'user';
  video.style.transform = facingMode==='user' ? 'scaleX(-1)' : 'scaleX(1)';
  await openCamera();
}
window.flipCamera = flipCamera;

function capturePhoto() {
  document.getElementById('flash').classList.add('on');
  setTimeout(()=>document.getElementById('flash').classList.remove('on'), 150);
  const tmp = document.createElement('canvas');
  tmp.width = canvas.width; tmp.height = canvas.height;
  const tc = tmp.getContext('2d');
  tc.save();
  if (facingMode==='user') { tc.translate(tmp.width,0); tc.scale(-1,1); }
  tc.drawImage(video, 0, 0, tmp.width, tmp.height);
  tc.restore();
  tc.drawImage(canvas, 0, 0);
  lastCaptured = tmp;
  savePhoto();
}
window.capturePhoto = capturePhoto;

function savePhoto() {
  if (!lastCaptured) { capturePhoto(); return; }
  const a = document.createElement('a');
  a.download = `ar-${Date.now()}.png`;
  a.href = lastCaptured.toDataURL('image/png');
  a.click();
}
window.savePhoto = savePhoto;
</script>
